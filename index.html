<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>小宇英文</title>
    <meta name="description" content="國一英文（國中英語七上）段考複習：觀念引導、粗心偵測、錯題本、模擬段考、口說練習。" />
    <meta name="theme-color" content="#cfe6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小宇英文" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png" />
    <link rel="manifest" href="manifest-v2.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // 外觀：花園（2.25，預設）／講義筆記本（2.22，設定 → 外觀）；設 g7review:skin=old 可以看回 2.20（拍前後對照用）
      // 字型（開源 SIL OFL）：花園＝數字用 Nunito（只有英數，很小）；講義＝標題用霞鶩文楷（依字切片）
      // 不擋畫面：字型連不到（網路過濾、Wi-Fi 不穩）時先用系統字，App 照常打開
      ;(function () {
        var s = 'garden'
        try { s = localStorage.getItem('g7review:skin') || 'garden' } catch (e) {}
        if (s !== 'notebook' && s !== 'old') s = 'garden' // 不認得的值（打錯、舊版）一律當花園
        document.documentElement.dataset.skin = s
        if (s === 'notebook') document.querySelector('meta[name=theme-color]').setAttribute('content', '#f7f3ea')
        var f = s === 'notebook' ? 'LXGW+WenKai+TC:wght@400;700' : s === 'garden' ? 'Nunito:wght@700;800' : ''
        if (!f) return
        var l = document.createElement('link')
        l.rel = 'stylesheet'
        l.href = 'https://fonts.googleapis.com/css2?family=' + f + '&display=swap'
        l.media = 'print'
        l.onload = function () { this.media = 'all' }
        document.head.appendChild(l)
      })()
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"><div class="boot">載入中…</div></div>
    <noscript><p style="padding: 24px">請開啟 JavaScript 才能使用。</p></noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
