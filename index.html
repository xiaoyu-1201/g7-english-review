<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>小宇英文</title>
    <meta name="description" content="國一英文（國中英語七上）段考複習：觀念引導、粗心偵測、錯題本、模擬段考、口說練習。" />
    <meta name="theme-color" content="#cfe6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小宇英文" />
    <!-- 2.25.3 主畫面圖示：照拐乖記帳的做法（icons/ 資料夾；離線程式先存好圖示，iPhone 抓圖示時直接給） -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v4.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v4.png" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // 外觀：花園（2.25，預設）／講義筆記本（2.22，設定 → 外觀）；設 g7review:skin=old 可以看回 2.20（拍前後對照用）
      // 外觀；字型一律用 Apple 系統字（2.32），不載入網路字型
      ;(function () {
        var s = 'garden'
        try { s = localStorage.getItem('g7review:skin') || 'garden' } catch (e) {}
        if (s !== 'notebook' && s !== 'old') s = 'garden' // 不認得的值（打錯、舊版）一律當花園
        document.documentElement.dataset.skin = s
        if (s === 'notebook') document.querySelector('meta[name=theme-color]').setAttribute('content', '#f7f3ea')
      })()
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"><div class="boot">載入中…</div></div>
    <noscript><p style="padding: 24px">請開啟 JavaScript 才能使用。</p></noscript>
    <script src="vendor/budoux-zh-hant.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
